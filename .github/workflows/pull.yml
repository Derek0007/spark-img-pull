name: Pull spark-vllm-b12x and publish as release assets

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Image ref'
        required: false
        default: 'eugr/spark-vllm-b12x@sha256:03a956544e9f9b4b7ba91690469fbe7848bdbef29a7d2e0f5788368467bb3595'
      split_mb:
        description: 'Split size MB (Release asset cap 2048)'
        required: false
        default: '1800'

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: Inspect storage layout
        run: |
          echo "=== mounts ==="
          df -h
          echo
          echo "=== docker root ==="
          docker info --format '{{.DockerRootDir}}'
          echo "=== /mnt ==="
          ls -la /mnt 2>/dev/null || true

      - name: Maximize free space
        run: |
          set -x
          # Large preinstalled toolchains shipped on GH runners
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /opt/ghc
          sudo rm -rf /opt/hostedtoolcache
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf /usr/local/lib/node_modules
          sudo rm -rf /opt/microsoft
          sudo rm -rf /usr/lib/jvm
          sudo rm -rf /usr/local/aws-cli
          sudo rm -rf /usr/local/aws
          sudo rm -rf /opt/pipx
          sudo rm -rf /usr/local/.ghcup
          sudo rm -rf /usr/share/swift
          # Package caches
          sudo apt-get clean
          sudo rm -rf /var/lib/apt/lists/*
          sudo rm -rf /var/cache/apt/archives/*.deb
          # Drop any preloaded docker images
          docker image prune -af || true
          docker builder prune -af || true
          echo "=== after cleanup ==="
          df -h /

      - name: Pull image (arm64)
        run: |
          set -euo pipefail
          IMAGE="${{ github.event.inputs.image }}"
          docker pull "$IMAGE"
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}'
          df -h /

      - name: Export streamed -> gzip -> split
        run: |
          set -euo pipefail
          IMAGE="${{ github.event.inputs.image }}"
          ID=$(docker inspect --format '{{.Id}}' "$IMAGE")
          ARCH=$(docker inspect --format '{{.Architecture}}' "$IMAGE")
          echo "ID=$ID ARCH=$ARCH"
          df -h /

          mkdir -p "$RUNNER_TEMP/out"
          OUT="$RUNNER_TEMP/out"
          echo "Writing parts to: $OUT"

          # Stream: save | gzip(-1) | split. Peak disk = docker image + compressed parts only.
          docker save "$ID" | gzip -1 | split -b "${{ github.event.inputs.split_mb }}m" -d -a 1 - "$OUT/spark-vllm.part."

          df -h /
          ls -lh "$OUT"
          cd "$OUT"
          sha256sum spark-vllm.part.* > SHA256SUMS
          printf 'image=%s\nimage_id=%s\narchitecture=%s\ncompression=gzip\nrebuild=%s\nparts_total=%s\npulled_at=%s\n' \
            "$IMAGE" "$ID" "$ARCH" \
            'cat spark-vllm.part.* | gunzip | docker load' \
            "$(ls -1 spark-vllm.part.* | wc -l)" \
            "$(date -u +%FT%TZ)" > METADATA.txt
          cat METADATA.txt
          du -sh "$OUT"

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/out"
          TAG="img-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "spark-vllm-b12x $TAG" \
            --notes "arm64 image export, gzip streams split into parts. Rebuild: cat spark-vllm.part.* | gunzip | docker load" \
            "$OUT"/spark-vllm.part.* "$OUT"/SHA256SUMS "$OUT"/METADATA.txt
          echo "### Published: $TAG" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets \
            -q '.assets[] | "\(.name)  \(.size) bytes"' >> "$GITHUB_STEP_SUMMARY"
