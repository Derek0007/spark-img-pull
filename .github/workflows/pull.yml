name: Pull spark-vllm-b12x and publish as release assets

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Image ref'
        required: false
        default: 'eugr/spark-vllm-b12x@sha256:03a956544e9f9b4b7ba91690469fbe7848bdbef29a7d2e0f5788368467bb3595'
      split_mb:
        description: 'Split size MB (Release asset cap is 2048)'
        required: false
        default: '1800'

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: Free disk space
        run: |
          echo "--- before ---"
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL \
                      /usr/local/lib/node_modules /opt/microsoft 2>/dev/null || true
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* /var/cache/apt/archives/*.deb 2>/dev/null || true
          echo "--- after ---"
          df -h /

      - name: Pull image (arm64)
        run: |
          set -euo pipefail
          IMAGE="${{ github.event.inputs.image }}"
          echo "Pulling: $IMAGE"
          docker pull "$IMAGE"
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}'
          df -h /

      - name: Save | gzip | split  (streamed, needs ~half the disk)
        run: |
          set -euo pipefail
          IMAGE="${{ github.event.inputs.image }}"
          ID=$(docker inspect --format '{{.Id}}' "$IMAGE")
          ARCH=$(docker inspect --format '{{.Architecture}}' "$IMAGE")
          echo "ID=$ID ARCH=$ARCH"
          echo "--- disk before save ---"
          df -h /

          mkdir -p out
          # gzip -1 keeps it fast; split at 1800m stays under the 2 GiB asset cap
          docker save "$ID" | gzip -1 | split -b "${{ github.event.inputs.split_mb }}m" -d -a 1 - out/spark-vllm.part.

          echo "--- after ---"
          df -h /
          ls -lh out/
          cd out
          sha256sum spark-vllm.part.* > SHA256SUMS
          printf 'image=%s\nimage_id=%s\narchitecture=%s\ncompression=gzip\nrebuild=%s\npulled_at=%s\n' \
            "$IMAGE" "$ID" "$ARCH" \
            'cat spark-vllm.part.* | gunzip | docker load' \
            "$(date -u +%FT%TZ)" > METADATA.txt
          cat METADATA.txt
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="img-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "spark-vllm-b12x $TAG" \
            --notes "arm64 image export. Parts are gzip streams: cat parts | gunzip | docker load. See METADATA.txt / SHA256SUMS." \
            out/spark-vllm.part.* out/SHA256SUMS out/METADATA.txt
          echo "### Published: $TAG" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets \
            -q '.assets[] | "\(.name)  \(.size) bytes"'
