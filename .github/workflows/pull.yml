name: Pull spark-vllm-b12x and publish as release assets

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Image ref'
        required: false
        default: 'eugr/spark-vllm-b12x@sha256:03a956544e9f9b4b7ba91690469fbe7848bdbef29a7d2e0f5788368467bb3595'
      split_mb:
        description: 'Split size MB'
        required: false
        default: '1500'

permissions:
  contents: write

jobs:
  pull:
    # arm64 runner keeps native pull; if unavailable, fallback job below handles it
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: Disk info
        run: |
          df -h /
          nproc

      - name: Pull image (arm64)
        run: |
          IMAGE="${{ github.event.inputs.image }}"
          echo "Pulling: $IMAGE"
          docker pull "$IMAGE"
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}'

      - name: Save, split, checksum
        run: |
          set -euo pipefail
          IMAGE="${{ github.event.inputs.image }}"
          ID=$(docker inspect --format '{{.Id}}' "$IMAGE")
          ARCH=$(docker inspect --format '{{.Architecture}}' "$IMAGE")
          SIZE=$(docker inspect --format '{{.Size}}' "$IMAGE")
          echo "ID=$ID ARCH=$ARCH SIZE=$SIZE"

          mkdir -p out
          docker save "$ID" -o out/spark-vllm.tar
          ls -lh out/spark-vllm.tar

          split -b "${{ github.event.inputs.split_mb }}m" -d -a 1 out/spark-vllm.tar out/spark-vllm.part.
          rm -f out/spark-vllm.tar
          ls -lh out/

          cd out
          sha256sum spark-vllm.part.* > SHA256SUMS
          printf 'image=%s\nimage_id=%s\narchitecture=%s\nsize_bytes=%s\npulled_at=%s\n' \
            "$IMAGE" "$ID" "$ARCH" "$SIZE" "$(date -u +%FT%TZ)" > METADATA.txt
          cat METADATA.txt
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="img-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "spark-vllm-b12x $TAG" \
            --notes "arm64 image export, split parts, see METADATA.txt" \
            out/spark-vllm.part.* out/SHA256SUMS out/METADATA.txt
          echo "TAG=$TAG" >> "$GITHUB_STEP_SUMMARY"
          echo "Published: $TAG" >> "$GITHUB_STEP_SUMMARY"
