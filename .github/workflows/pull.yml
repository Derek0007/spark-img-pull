name: Pull spark-vllm-b12x and publish as release assets

on:
  workflow_dispatch:
    inputs:
      image:
        description: 'Image ref'
        required: false
        default: 'eugr/spark-vllm-b12x@sha256:03a956544e9f9b4b7ba91690469fbe7848bdbef29a7d2e0f5788368467bb3595'
      split_mb:
        description: 'Split size MB'
        required: false
        default: '1900'

permissions:
  contents: write

jobs:
  pull:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    steps:
      - name: Free disk space first
        run: |
          echo "--- before ---"
          df -h /
          # Remove preinstalled toolchains we do not need (frees ~25-30 GB)
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /usr/local/share/boost /opt/hostedtoolcache/CodeQL || true
          sudo apt-get clean || true
          sudo rm -rf /var/lib/apt/lists/* || true
          echo "--- after ---"
          df -h /

      - name: Pull image (arm64, pipe to file, no docker storage)
        run: |
          set -euo pipefail
          IMAGE="${{ github.event.inputs.image }}"
          echo "Pulling: $IMAGE"
          docker pull "$IMAGE"
          docker images --format '{{.Repository}}:{{.Tag}} {{.Size}}'
          df -h /

      - name: Save to file and split on the fly
        run: |
          set -euo pipefail
          IMAGE="${{ github.event.inputs.image }}"
          ID=$(docker inspect --format '{{.Id}}' "$IMAGE")
          ARCH=$(docker inspect --format '{{.Architecture}}' "$IMAGE")
          echo "ID=$ID ARCH=$ARCH"
          mkdir -p out
          # Pipe docker save straight into split: no intermediate 18GB file
          docker save "$ID" | split -b "${{ github.event.inputs.split_mb }}m" -d -a 1 - out/spark-vllm.part.
          df -h /
          ls -lh out/
          cd out
          sha256sum spark-vllm.part.* > SHA256SUMS
          printf 'image=%s\nimage_id=%s\narchitecture=%s\npulled_at=%s\n' \
            "$IMAGE" "$ID" "$ARCH" "$(date -u +%FT%TZ)" > METADATA.txt
          cat METADATA.txt
          cat SHA256SUMS

      - name: Publish release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          TAG="img-$(date -u +%Y%m%d-%H%M%S)"
          gh release create "$TAG" \
            --repo "${{ github.repository }}" \
            --title "spark-vllm-b12x $TAG" \
            --notes "arm64 image export (split parts). See METADATA.txt and SHA256SUMS." \
            out/spark-vllm.part.* out/SHA256SUMS out/METADATA.txt
          echo "### Published release: $TAG" >> "$GITHUB_STEP_SUMMARY"
          gh release view "$TAG" --repo "${{ github.repository }}" --json assets -q '.assets[] | "\(.name) \(.size)"'
